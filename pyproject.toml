[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tfc-forge-helper"
version = "0.2.5"
description = "External TerraFirmaCraft 1.21.1 forging assistant with opt-in verified automation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment",
]
dependencies = ["Pillow>=10.4,<13", "numpy>=1.26,<3", "opencv-python-headless>=4.10,<5", "mss>=10.2,<11", "psutil>=6,<8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]
release = ["build>=1.2,<2", "twine>=6,<7", "pyinstaller>=6,<7; sys_platform == 'win32'"]

[project.urls]
Repository = "https://github.com/ChuanYuanNotBoat/tfc-forge-helper"
Issues = "https://github.com/ChuanYuanNotBoat/tfc-forge-helper/issues"
Releases = "https://github.com/ChuanYuanNotBoat/tfc-forge-helper/releases"

[project.scripts]
tfc-forge = "tfc_forge_helper.cli:main"

[project.gui-scripts]
tfc-forge-gui = "tfc_forge_helper.gui:launch"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
